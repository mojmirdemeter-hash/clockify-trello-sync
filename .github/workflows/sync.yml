name: Sync Clockify time to Trello

on:
  schedule:
    # Bezi v :07 a :37 kazdej hodiny (nie presne o :00/:30) - GitHub ma
    # v tychto "okruhlych" casoch najvacsiu zataz a niektore scheduled
    # behy vtedy zahadzuje. Mimo spicky su spustenia spolahlivejsie.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}   # umoznuje spustit rucne tlacidlom "Run workflow"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_API_KEY }}
          CLOCKIFY_WORKSPACE_ID: ${{ vars.CLOCKIFY_WORKSPACE_ID }}
          CLOCKIFY_PROJECT_ID: ${{ vars.CLOCKIFY_PROJECT_ID }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ vars.TRELLO_BOARD_ID }}
          TRELLO_CUSTOM_FIELD_NAME: ${{ vars.TRELLO_CUSTOM_FIELD_NAME }}
          TRELLO_LIST_NAMES: ${{ vars.TRELLO_LIST_NAMES }}
        run: python sync_time.py
