name: Keepalive (zabrani vypnutiu sync workflow po 60 dnoch neaktivity)

on:
  schedule:
    # Raz za 30 dni - dost casto, aby sme sa nikdy nepriblizili k 60-dnovemu
    # limitu, kedy GitHub automaticky vypina scheduled workflows.
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prazdny commit len na udrzanie aktivity repozitara
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive commit (drzi sync workflow aktivny)"
          git push
